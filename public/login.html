<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>AAA Internal · Sign in</title>
    <style>
      :root {
        --teal: #004d43;
        --lime: #e6ff2b;
        --cream: #f9f7f2;
        --body: #636363;
        --gray: #898a8d;
        --divider: #d8d8d8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--cream);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #010101;
        padding: 24px;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: #fff;
        border: 1px solid var(--divider);
        border-radius: 16px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        padding: 32px;
      }
      .kicker {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--gray);
      }
      h1 { font-size: 20px; color: var(--teal); margin: 4px 0 0; }
      .sub { font-size: 14px; color: var(--body); margin-top: 8px; }
      button {
        font-family: inherit;
        font-size: 14px;
      }
      .btn {
        width: 100%;
        border-radius: 10px;
        padding: 11px;
        cursor: pointer;
        border: 1px solid var(--divider);
        background: #fff;
        transition: background 0.15s;
        margin-top: 16px;
      }
      .btn:hover { background: var(--cream); }
      .btn:disabled { opacity: 0.5; cursor: default; }
      #signin { margin-top: 16px; min-height: 120px; }
      .msg { font-size: 13px; margin-top: 16px; border-radius: 10px; padding: 12px; }
      .msg-ok { color: var(--teal); background: rgba(230, 255, 43, 0.3); }
      .msg-err { color: #b00020; background: #fdecea; }
      .hidden { display: none; }
      .foot { font-size: 11px; color: var(--gray); margin-top: 20px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="kicker">Automation Architecture</div>
      <h1>AAA Internal · Sign in</h1>
      <p class="sub">Internal tool — authorized access only.</p>

      <div id="signin"></div>

      <div id="forbidden" class="hidden">
        <div class="msg msg-err">
          This account isn’t authorized for the founder view. Sign in with an
          authorized account.
        </div>
        <button class="btn" id="switch">Sign out &amp; use another account</button>
      </div>

      <div id="status" class="msg hidden"></div>
      <p class="foot">Access is gated at the edge — authorized emails only.</p>
    </div>

    <script type="module">
      import { loadClerk } from "/auth/clerk.js";

      const params = new URLSearchParams(location.search);
      const $ = (id) => document.getElementById(id);
      const status = $("status");
      function show(el) { el.classList.remove("hidden"); }
      function hide(el) { el.classList.add("hidden"); }
      function setStatus(text, ok) {
        status.textContent = text;
        status.className = "msg " + (ok ? "msg-ok" : "msg-err");
        show(status);
      }

      let clerk;
      try {
        clerk = await loadClerk();
      } catch (err) {
        setStatus(err.message || "Clerk is not configured.", false);
        throw err;
      }

      $("switch").addEventListener("click", async () => {
        await clerk.signOut();
        location.href = "/login";
      });

      if (params.get("error") === "forbidden") {
        hide($("signin"));
        show($("forbidden"));
      } else if (params.get("error") === "auth") {
        setStatus("Sign-in failed — please try again.", false);
        clerk.mountSignIn($("signin"), {
          routing: "virtual",
          forceRedirectUrl: "/",
          signUpUrl: "/login",
        });
      } else if (clerk.isSignedIn) {
        // Already signed in? Bounce to the dashboard; the edge gate
        // re-checks the allowlist. Skipped when forbidden to avoid a loop.
        location.replace("/");
      } else {
        clerk.mountSignIn($("signin"), {
          routing: "virtual",
          forceRedirectUrl: "/",
          signUpUrl: "/login",
        });
      }
    </script>
  </body>
</html>
